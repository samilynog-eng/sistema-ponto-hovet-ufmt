<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponto Eletrônico HOVET - UFMT Sinop</title>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            ufmt: {
              green: '#006837',
              darkgreen: '#004d28',
              lightgreen: '#e6f4ed',
              blue: '#00529b',
              amber: '#d97706'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // === DADOS INICIAIS DA APLICAÇÃO ===
    const INITIAL_USERS = [
      {
        id: 'res-1',
        name: 'Dra. Maria Souza',
        crmv: 'CRMV-MT 4589',
        area: 'Anestesiologia Veterinária',
        email: 'maria',
        pass: '123',
        role: 'resident'
      },
      {
        id: 'res-2',
        name: 'Dr. João Pedro Santos',
        crmv: 'CRMV-MT 5120',
        area: 'Clínica de Grandes Animais',
        email: 'joao',
        pass: '123',
        role: 'resident'
      },
      {
        id: 'res-3',
        name: 'Dra. Ana Paula Silva',
        crmv: 'CRMV-MT 4890',
        area: 'Cirurgia de Pequenos Animais',
        email: 'ana',
        pass: '123',
        role: 'resident'
      },
      {
        id: 'admin-1',
        name: 'Prof. Dr. Coordenador HOVET',
        crmv: 'CRMV-MT 2100',
        area: 'Coordenação Geral da Residência',
        email: 'admin',
        pass: '123',
        role: 'admin'
      }
    ];

    const INITIAL_RECORDS = [
      {
        id: 'rec-1',
        residentId: 'res-1',
        residentName: 'Dra. Maria Souza',
        crmv: 'CRMV-MT 4589',
        type: 'Entrada',
        timestamp: '2026-10-30T07:01:20',
        date: '2026-10-30',
        time: '07:01:20',
        lat: -11.858421,
        lng: -55.514210,
        gpsStatus: 'GPS Alta Precisão',
        observation: 'Chegada antecipada para procedimento de emergência.'
      },
      {
        id: 'rec-2',
        residentId: 'res-1',
        residentName: 'Dra. Maria Souza',
        crmv: 'CRMV-MT 4589',
        type: 'Saída Almoço',
        timestamp: '2026-10-30T11:30:45',
        date: '2026-10-30',
        time: '11:30:45',
        lat: -11.858400,
        lng: -55.514190,
        gpsStatus: 'GPS Alta Precisão',
        observation: ''
      },
      {
        id: 'rec-3',
        residentId: 'res-2',
        residentName: 'Dr. João Pedro Santos',
        crmv: 'CRMV-MT 5120',
        type: 'Entrada Plantão',
        timestamp: '2026-10-30T18:00:10',
        date: '2026-10-30',
        time: '18:00:10',
        lat: -11.858450,
        lng: -55.514300,
        gpsStatus: 'GPS Alta Precisão',
        observation: 'Início de plantão no setor de Grandes Animais.'
      }
    ];

    function App() {
      // === ESTADOS DO SISTEMA COM PERSISTÊNCIA LOCALSTORAGE ===
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('hovet_users');
        return saved ? JSON.parse(saved) : INITIAL_USERS;
      });

      const [punchRecords, setPunchRecords] = useState(() => {
        const saved = localStorage.getItem('hovet_records');
        return saved ? JSON.parse(saved) : INITIAL_RECORDS;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('hovet_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      // Aba ativa
      const [activeTab, setActiveTab] = useState('punch'); 

      // Formulário de Login
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginRoleToggle, setLoginRoleToggle] = useState('resident'); // 'resident' ou 'admin'
      const [loginError, setLoginError] = useState('');

      // Modal de Ponto
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedPunchType, setSelectedPunchType] = useState('');
      const [punchObservation, setPunchObservation] = useState('');
      const [isFetchingGps, setIsFetchingGps] = useState(false);
      const [gpsData, setGpsData] = useState({ lat: null, lng: null, status: '', error: false });
      const [toastMessage, setToastMessage] = useState('');

      // Filtros de Relatório
      const [filterResidentId, setFilterResidentId] = useState('ALL');
      const [filterStartDate, setFilterStartDate] = useState('');
      const [filterEndDate, setFilterEndDate] = useState('');

      // Novo Residente Form (Coordenação)
      const [newRes, setNewRes] = useState({ name: '', crmv: '', area: '', email: '', pass: '' });
      const [adminNotice, setAdminNotice] = useState('');

      // Data/Hora em tempo real
      const [now, setNow] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Gravação no localStorage
      useEffect(() => {
        localStorage.setItem('hovet_users', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem('hovet_records', JSON.stringify(punchRecords));
      }, [punchRecords]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('hovet_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('hovet_current_user');
        }
      }, [currentUser]);

      // Login
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const user = users.find(u => 
          u.email.toLowerCase().trim() === loginUser.toLowerCase().trim() && 
          u.pass === loginPass &&
          u.role === loginRoleToggle
        );

        if (user) {
          setCurrentUser(user);
          setActiveTab(user.role === 'admin' ? 'admin-report' : 'punch');
        } else {
          setLoginError('Credenciais inválidas para o perfil selecionado. Teste os acessos rápidos abaixo!');
        }
      };

      // Atalho de Login Rápido
      const quickLogin = (type) => {
        if (type === 'maria') {
          const u = users.find(x => x.email === 'maria');
          if (u) { setCurrentUser(u); setActiveTab('punch'); }
        } else if (type === 'admin') {
          const u = users.find(x => x.email === 'admin');
          if (u) { setCurrentUser(u); setActiveTab('admin-report'); }
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setLoginUser('');
        setLoginPass('');
      };

      // Abrir modal para bater ponto
      const triggerPunchModal = (type) => {
        setSelectedPunchType(type);
        setPunchObservation('');
        setIsModalOpen(true);
        setIsFetchingGps(true);
        setGpsData({ lat: null, lng: null, status: 'Capturando geolocalização do dispositivo...', error: false });

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              setGpsData({
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                status: 'GPS Localizado com Sucesso!',
                error: false
              });
              setIsFetchingGps(false);
            },
            (err) => {
              // Fallback HOVET UFMT Sinop se o GPS for negado ou indisponível
              setGpsData({
                lat: -11.858421,
                lng: -55.514210,
                status: 'GPS Aproximado (HOVET UFMT Sinop)',
                error: true
              });
              setIsFetchingGps(false);
            },
            { enableHighAccuracy: true, timeout: 8000 }
          );
        } else {
          setGpsData({
            lat: -11.858421,
            lng: -55.514210,
            status: 'GPS não suportado. Coordenadas padrão HOVET.',
            error: true
          });
          setIsFetchingGps(false);
        }
      };

      // Salvar Ponto
      const confirmPunch = () => {
        if (!currentUser) return;
        const currentDate = new Date();
        const formattedDate = currentDate.toISOString().split('T')[0];
        const formattedTime = currentDate.toTimeString().split(' ')[0];

        const record = {
          id: 'rec-' + Date.now(),
          residentId: currentUser.id,
          residentName: currentUser.name,
          crmv: currentUser.crmv || 'Não informado',
          type: selectedPunchType,
          timestamp: currentDate.toISOString(),
          date: formattedDate,
          time: formattedTime,
          lat: gpsData.lat || -11.858421,
          lng: gpsData.lng || -55.514210,
          gpsStatus: gpsData.status,
          observation: punchObservation.trim()
        };

        setPunchRecords(prev => [record, ...prev]);
        setIsModalOpen(false);

        // Feedback Toast
        setToastMessage(`Ponto "${selectedPunchType}" registrado com sucesso!`);
        setTimeout(() => setToastMessage(''), 4000);
      };

      // Novo Residente (Coordenação)
      const handleRegisterResident = (e) => {
        e.preventDefault();
        if (!newRes.name || !newRes.email || !newRes.pass) {
          setAdminNotice('Preencha os campos obrigatórios (*)');
          return;
        }

        const created = {
          id: 'res-' + Date.now(),
          name: newRes.name,
          crmv: newRes.crmv || 'CRMV-MT Indefinido',
          area: newRes.area || 'Residência Veterinária',
          email: newRes.email,
          pass: newRes.pass,
          role: 'resident'
        };

        setUsers(prev => [...prev, created]);
        setNewRes({ name: '', crmv: '', area: '', email: '', pass: '' });
        setAdminNotice('Residente cadastrado com sucesso!');
        setTimeout(() => setAdminNotice(''), 3000);
      };

      const handleDeleteUser = (id) => {
        if (confirm('Deseja realmente remover este residente?')) {
          setUsers(prev => prev.filter(u => u.id !== id));
        }
      };

      // Filtragem dos registros
      const filteredRecords = useMemo(() => {
        return punchRecords.filter(rec => {
          // Se não for admin, vê APENAS os seus pontos
          if (currentUser?.role !== 'admin') {
            if (rec.residentId !== currentUser.id) return false;
          } else {
            // Filtro Admin por Residente
            if (filterResidentId !== 'ALL' && rec.residentId !== filterResidentId) return false;
          }

          // Filtro por Data
          if (filterStartDate && rec.date < filterStartDate) return false;
          if (filterEndDate && rec.date > filterEndDate) return false;

          return true;
        });
      }, [punchRecords, currentUser, filterResidentId, filterStartDate, filterEndDate]);

      // Configuração dos Botões de Ponto
      const PUNCH_BUTTONS = [
        { label: 'Entrada', color: 'from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 border-emerald-500/40', icon: 'fa-right-to-bracket' },
        { label: 'Saída Almoço', color: 'from-amber-600 to-orange-700 hover:from-amber-500 hover:to-orange-600 border-amber-500/40', icon: 'fa-utensils' },
        { label: 'Retorno Almoço', color: 'from-teal-600 to-cyan-700 hover:from-teal-500 hover:to-cyan-600 border-teal-500/40', icon: 'fa-rotate-left' },
        { label: 'Saída', color: 'from-rose-600 to-red-700 hover:from-rose-500 hover:to-red-600 border-rose-500/40', icon: 'fa-right-from-bracket' },
        { label: 'Entrada Plantão', color: 'from-indigo-600 to-blue-700 hover:from-indigo-500 hover:to-blue-600 border-indigo-500/40', icon: 'fa-user-nurse' },
        { label: 'Saída Plantão', color: 'from-purple-600 to-violet-700 hover:from-purple-500 hover:to-violet-600 border-purple-500/40', icon: 'fa-business-time' }
      ];

      // Resetar dados para o estado inicial
      const resetDatabase = () => {
        if (confirm('Tem certeza que deseja restaurar os dados de demonstração originais?')) {
          setUsers(INITIAL_USERS);
          setPunchRecords(INITIAL_RECORDS);
          localStorage.removeItem('hovet_users');
          localStorage.removeItem('hovet_records');
          alert('Dados restaurados com sucesso.');
        }
      };

      // =======================================================
      // TELA DE LOGIN (Sem Autenticação)
      // =======================================================
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4 relative overflow-hidden">
            {/* Elementos visuais de fundo */}
            <div className="absolute top-0 left-1/4 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute bottom-0 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

            <div className="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl overflow-hidden z-10">
              
              {/* Header do Card */}
              <div className="bg-gradient-to-r from-ufmt-darkgreen via-emerald-800 to-teal-900 p-6 text-center border-b border-emerald-600/30">
                <div className="inline-flex p-3 bg-white/10 rounded-2xl mb-3 backdrop-blur-md">
                  <i className="fa-solid fa-stethoscope text-3xl text-emerald-300"></i>
                </div>
                <h1 className="text-xl font-black text-white tracking-wide">HOVET UFMT SINOP</h1>
                <p className="text-xs text-emerald-200 font-medium mt-1">Sistema Eletrônico de Frequência de Residentes</p>
              </div>

              <div className="p-6 space-y-5">
                
                {/* Seletor de Perfil (Residente vs Coordenação) */}
                <div className="bg-slate-950 p-1 rounded-xl flex border border-slate-800">
                  <button
                    type="button"
                    onClick={() => setLoginRoleToggle('resident')}
                    className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                      loginRoleToggle === 'resident'
                        ? 'bg-emerald-600 text-white shadow-md'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <i className="fa-solid fa-user-doctor"></i> Residente
                  </button>
                  <button
                    type="button"
                    onClick={() => setLoginRoleToggle('admin')}
                    className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                      loginRoleToggle === 'admin'
                        ? 'bg-ufmt-blue text-white shadow-md'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <i className="fa-solid fa-user-shield"></i> Coordenação
                  </button>
                </div>

                {loginError && (
                  <div className="bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs p-3 rounded-xl flex items-center gap-2">
                    <i className="fa-solid fa-triangle-exclamation text-rose-400"></i>
                    <span>{loginError}</span>
                  </div>
                )}

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                      Usuário / E-mail
                    </label>
                    <div className="relative">
                      <i className="fa-solid fa-user absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                      <input
                        type="text"
                        required
                        value={loginUser}
                        onChange={(e) => setLoginUser(e.target.value)}
                        placeholder={loginRoleToggle === 'resident' ? 'maria' : 'admin'}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                      Senha
                    </label>
                    <div className="relative">
                      <i className="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                      <input
                        type="password"
                        required
                        value={loginPass}
                        onChange={(e) => setLoginPass(e.target.value)}
                        placeholder="••••••••"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className={`w-full py-3 rounded-xl text-sm font-bold text-white shadow-lg transition-all flex items-center justify-center gap-2 ${
                      loginRoleToggle === 'resident'
                        ? 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-900/40'
                        : 'bg-ufmt-blue hover:bg-blue-600 shadow-blue-900/40'
                    }`}
                  >
                    <span>Acessar Painel</span>
                    <i className="fa-solid fa-arrow-right"></i>
                  </button>
                </form>

                {/* BOTÕES DE TESTE RÁPIDO */}
                <div className="pt-4 border-t border-slate-800 space-y-2">
                  <p className="text-[11px] text-slate-400 font-semibold text-center uppercase tracking-wider">
                    Acesso Rápido para Testes Rápidos:
                  </p>
                  
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => quickLogin('maria')}
                      className="p-2.5 bg-slate-800 hover:bg-slate-750 border border-slate-700 rounded-xl text-left transition-all"
                    >
                      <div className="text-xs font-bold text-emerald-400 flex items-center gap-1">
                        <i className="fa-solid fa-user"></i> Dra. Maria
                      </div>
                      <div className="text-[10px] text-slate-400 font-mono">User: maria | 123</div>
                    </button>

                    <button
                      type="button"
                      onClick={() => quickLogin('admin')}
                      className="p-2.5 bg-slate-800 hover:bg-slate-750 border border-slate-700 rounded-xl text-left transition-all"
                    >
                      <div className="text-xs font-bold text-blue-400 flex items-center gap-1">
                        <i className="fa-solid fa-shield-halved"></i> Coordenação
                      </div>
                      <div className="text-[10px] text-slate-400 font-mono">User: admin | 123</div>
                    </button>
                  </div>
                </div>

              </div>

              <div className="p-3 bg-slate-950 text-center border-t border-slate-800/80 text-[11px] text-slate-500">
                Hospital Veterinário HOVET - UFMT Sinop
              </div>
            </div>
          </div>
        );
      }

      // =======================================================
      // TELA PRINCIPAL (LOGADO)
      // =======================================================
      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-950 text-slate-100 font-sans">
          
          {/* TOAST NOTIFICAÇÃO */}
          {toastMessage && (
            <div className="fixed top-4 right-4 z-50 bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-emerald-400 animate-bounce">
              <i className="fa-solid fa-circle-check text-xl"></i>
              <span className="text-xs font-bold">{toastMessage}</span>
            </div>
          )}

          {/* BARRA LATERAL DA APLICAÇÃO */}
          <aside className="w-full md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0">
            {/* Topo do Menu */}
            <div className="p-5 border-b border-slate-800 bg-gradient-to-b from-slate-850 to-slate-900">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-emerald-600 text-white rounded-xl shadow-lg">
                  <i className="fa-solid fa-hospital text-xl"></i>
                </div>
                <div>
                  <h1 className="font-extrabold text-sm leading-tight text-white">HOVET UFMT</h1>
                  <p className="text-[11px] text-emerald-400 font-semibold">Campus de Sinop</p>
                </div>
              </div>
            </div>

            {/* Cartão de Perfil Logado */}
            <div className="p-4 bg-slate-950/60 border-b border-slate-800/80 flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-emerald-400 text-sm shadow">
                {currentUser.name.charAt(0)}
              </div>
              <div className="overflow-hidden">
                <p className="text-xs font-bold text-white truncate">{currentUser.name}</p>
                <p className="text-[10px] text-slate-400 truncate">{currentUser.area}</p>
                <span className={`inline-block px-1.5 py-0.5 rounded text-[9px] font-bold uppercase mt-1 ${
                  currentUser.role === 'admin' 
                    ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' 
                    : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                }`}>
                  {currentUser.role === 'admin' ? 'Coordenação' : 'Residente'}
                </span>
              </div>
            </div>

            {/* Menu de Navegação */}
            <nav className="flex-1 p-3 space-y-1">
              {currentUser.role !== 'admin' && (
                <button
                  onClick={() => setActiveTab('punch')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${
                    activeTab === 'punch'
                      ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-950'
                      : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <i className="fa-solid fa-clock text-sm w-4"></i>
                  <span>Bater Ponto</span>
                </button>
              )}

              <button
                onClick={() => setActiveTab('my-report')}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${
                  activeTab === 'my-report'
                    ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-950'
                    : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                }`}
              >
                <i className="fa-solid fa-file-lines text-sm w-4"></i>
                <span>{currentUser.role === 'admin' ? 'Meus Registros' : 'Meu Relatório'}</span>
              </button>

              {/* Seções da Coordenação */}
              {currentUser.role === 'admin' && (
                <div className="pt-4 mt-2 border-t border-slate-800">
                  <p className="px-3 text-[10px] font-bold text-blue-400 uppercase tracking-wider mb-2">
                    Módulos Administrativos
                  </p>

                  <button
                    onClick={() => setActiveTab('admin-report')}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${
                      activeTab === 'admin-report'
                        ? 'bg-ufmt-blue text-white shadow-lg shadow-blue-950'

                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white"
                      />
                    </div>

                    <div className="flex items-end">
                      <button
                        type="submit"
                        className="w-full bg-ufmt-blue hover:bg-blue-600 text-white font-bold p-2.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                      >
                        <i className="fa-solid fa-plus"></i>
                        Cadastrar Residente
                      </button>
                    </div>
                  </form>
                </div>

                {/* Lista de Usuários */}
                <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
                  <div className="p-4 bg-slate-950 border-b border-slate-800">
                    <h3 className="text-xs font-bold text-white uppercase tracking-wider">
                      Residentes Cadastrados ({users.length})
                    </h3>
                  </div>

                  <div className="divide-y divide-slate-800 text-xs">
                    {users.map(u => (
                      <div key={u.id} className="p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 hover:bg-slate-850/50">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-blue-400 text-sm">
                            {u.name.charAt(0)}
                          </div>
                          <div>
                            <p className="font-bold text-white">{u.name}</p>
                            <p className="text-slate-400 text-[11px]">{u.crmv} • {u.area}</p>
                            <p className="text-slate-500 text-[11px] font-mono">Usuário: {u.email}</p>
                          </div>
                        </div>

                        <div className="flex items-center gap-3">
                          <span className={`px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase ${
                            u.role === 'admin' 
                              ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' 
                              : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                          }`}>
                            {u.role === 'admin' ? 'Coordenação' : 'Residente'}
                          </span>

                          {u.role !== 'admin' && (
                            <button
                              onClick={() => handleDeleteUser(u.id)}
                              className="p-2 text-rose-400 hover:bg-rose-500/10 rounded-xl border border-rose-500/20 transition-colors"
                              title="Excluir Residente"
                            >
                              <i className="fa-solid fa-trash-can"></i>
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

          </main>
        </div>
      );
    }

    // Renderizar a Aplicação
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
