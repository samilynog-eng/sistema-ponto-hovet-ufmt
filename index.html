<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ponto - HOVET UFMT Sinop</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ufmt: {
                            blue: '#003366',
                            lightBlue: '#1e40af',
                            accent: '#0d9488',
                            green: '#15803d',
                            grayBg: '#f8fafc',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- CABEÇALHO INSTITUCIONAL -->
    <header class="bg-ufmt-blue text-white shadow-lg border-b-4 border-ufmt-accent no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="bg-white p-2 rounded-xl text-ufmt-blue font-bold text-2xl shadow-sm flex items-center justify-center w-12 h-12">
                        <i class="fa-solid font-bold fa-user-doctor"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-xl md:text-2xl tracking-wide">HOVET - UFMT Sinop</h1>
                        <p class="text-xs text-teal-200 font-medium">Hospital Veterinário • Campus Universitário de Sinop</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-6">
                    <div class="text-center md:text-right">
                        <div id="live-clock" class="text-2xl font-extrabold tracking-wider text-teal-300">00:00:00</div>
                        <div id="live-date" class="text-xs text-slate-300">-- de -- de ----</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- NAVEGAÇÃO / TABS -->
    <nav class="bg-white shadow-sm border-b border-slate-200 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-3">
                <div class="flex space-x-2 sm:space-x-4 overflow-x-auto">
                    <button onclick="switchTab('registro')" id="tab-registro" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 bg-ufmt-blue text-white shadow-sm">
                        <i class="fa-solid fa-clock"></i> Registrar Ponto
                    </button>
                    <button onclick="switchTab('espelho')" id="tab-espelho" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 text-slate-600 hover:bg-slate-100">
                        <i class="fa-solid fa-file-invoice"></i> Espelho de Ponto
                    </button>
                    <button onclick="openCoordModal()" id="tab-admin" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 text-slate-600 hover:bg-slate-100">
                        <i class="fa-solid fa-user-shield"></i> Painel da Coordenação
                    </button>
                </div>
                <div id="logout-btn-container" class="hidden">
                    <button onclick="logoutCoord()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair da Coordenação
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- ABA 1: REGISTRO DE PONTO -->
        <section id="sec-registro" class="space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- FORMULÁRIO DE REGISTRO -->
                <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-bold text-ufmt-blue mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-ufmt-accent"></i> Nova Marcação de Ponto
                    </h2>

                    <form id="form-ponto" onsubmit="salvarPonto(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Selecione o Residente *</label>
                            <select id="reg-residente" required onchange="autopreencherResidente()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-ufmt-accent focus:outline-none">
                                <option value="">-- Selecione o seu nome --</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">CPF / Matrícula</label>
                                <input type="text" id="reg-cpf" readonly class="w-full bg-slate-100 border border-slate-200 rounded-lg p-3 text-sm text-slate-500 cursor-not-allowed">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Setor / Especialidade</label>
                                <input type="text" id="reg-setor" readonly class="w-full bg-slate-100 border border-slate-200 rounded-lg p-3 text-sm text-slate-500 cursor-not-allowed">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tipo de Registro *</label>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                <label class="cursor-pointer">
                                    <input type="radio" name="tipoPonto" value="Entrada" checked class="peer sr-only">
                                    <div class="p-3 text-center border rounded-xl peer-checked:bg-teal-50 peer-checked:border-ufmt-accent peer-checked:text-ufmt-accent font-semibold text-xs border-slate-200 hover:bg-slate-50 transition">
                                        🟢 Entrada
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="tipoPonto" value="Intervalo" class="peer sr-only">
                                    <div class="p-3 text-center border rounded-xl peer-checked:bg-amber-50 peer-checked:border-amber-500 peer-checked:text-amber-700 font-semibold text-xs border-slate-200 hover:bg-slate-50 transition">
                                        🟡 Almoço/Saída
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="tipoPonto" value="Retorno" class="peer sr-only">
                                    <div class="p-3 text-center border rounded-xl peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 font-semibold text-xs border-slate-200 hover:bg-slate-50 transition">
                                        🔵 Almoço/Volta
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="tipoPonto" value="Saída" class="peer sr-only">
                                    <div class="p-3 text-center border rounded-xl peer-checked:bg-rose-50 peer-checked:border-rose-500 peer-checked:text-rose-700 font-semibold text-xs border-slate-200 hover:bg-slate-50 transition">
                                        🔴 Saída
                                    </div>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Observação / Justificativa (Opcional)</label>
                            <input type="text" id="reg-obs" placeholder="Ex: Atendimento emergencial, Plantão Noturno..." class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-ufmt-accent focus:
